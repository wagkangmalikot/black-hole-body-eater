<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad_vacuole" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#d35400"/>
      <stop offset="85%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="shine_vacuole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_vacuole" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Glow Shadow -->
  <circle cx="32" cy="32" r="29" fill="url(#bgGrad_vacuole)" filter="url(#shadow_vacuole)"/>
  
  <!-- Outer Neon Border Ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#d35400" stroke-width="2" opacity="0.9"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Category Background Pattern -->
  
        <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.45"/>
      

  <!-- Glass Top Crescent Reflection -->
  <path d="M 12 24 A 22 22 0 0 1 52 24 A 27 27 0 0 0 12 24 Z" fill="url(#shine_vacuole)"/>

  <!-- Center Emoji Glyph -->
  <text x="32" y="41" font-size="25" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" filter="url(#shadow_vacuole)">🎈</text>
</svg>
